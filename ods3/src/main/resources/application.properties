spring.application.name=ods3
# Boot 4 moveu a conexao para spring.mongodb.*; spring.data.mongodb.uri esta
# deprecado em nivel 'error' desde a 4.0.0 e e ignorado (cairia no banco padrao 'test').
spring.mongodb.uri=mongodb://localhost:27017/plataforma_treinos

# Cria os indices declarados com @Indexed nas entidades na subida da aplicacao.
# Desligado por padrao no Spring Boot desde a 2.2 — sem isso, o @Indexed(unique = true)
# de Usuario.email e Treino.nome seria ignorado e a unicidade nunca seria aplicada.
spring.data.mongodb.auto-index-creation=true
